[workspace]
resolver = "2"
members = ["crates/porthub-terminal", "crates/porthub-identity", "crates/porthub-io", "crates/porthub-tunnel", "crates/porthub-agent", "crates/porthub-edge", "crates/porthub-api", "crates/porthub-transfer", "crates/porthub-runtime", "crates/porthub-firewall", "crates/porthub-mesh", "crates/porthub-network", "crates/porthub-egress"]
exclude = ["vendor/rathole", "vendor/nlink", "vendor/notify"]

[patch.crates-io]
nlink = { path = "vendor/nlink" }
notify = { path = "vendor/notify" }

[workspace.package]
version = "1.8.9"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rathole = { path = "vendor/rathole", default-features = false, features = ["client", "server", "websocket", "hot-reload"] }
porthub-tunnel = { path = "crates/porthub-tunnel" }

[profile.release]
lto = "thin"
strip = true

# Optimized local iteration without repeating cross-crate link-time optimization.
# Shipping artifacts continue to use the existing release profile.
[profile.agent-dev]
inherits = "release"
lto = false
incremental = true
codegen-units = 16
