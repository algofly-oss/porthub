# Production: docker compose up -d --build
# Development: PORTHUB_MODE=dev ./deploy.sh
x-common: &common
  restart: unless-stopped
  read_only: ${PORTHUB_READ_ONLY:-true}
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 20s
  tmpfs: ["/tmp:rw,nosuid,nodev,size=256m"]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  core:
    <<: *common
    image: porthub:core
    container_name: ${PORTHUB_CONTAINER_PREFIX:-porthub}-core
    build:
      context: .
      target: ${PORTHUB_MODE:-prod}-core
      args: {PORTHUB_VERSION: "${PORTHUB_VERSION:-1.7.0}", PORTHUB_SOURCE_REVISION: "${PORTHUB_SOURCE_REVISION:-unknown}", PORTHUB_BUILD_JOBS: "${PORTHUB_BUILD_JOBS:-4}"}
    env_file: [.env]
    environment:
      PORTHUB_MODE: ${PORTHUB_MODE:-prod}
      PORTHUB_VERSION: ${PORTHUB_VERSION:-1.7.0}
      PORTHUB_CLIENT_BINARY_DIR: /app/client-bin
      PORTHUB_API_SOCKET: /run/porthub-api/api.sock
      PORTHUB_EDGE_SOCKET: /run/porthub-edge/control.sock
      PORTHUB_DB_INITIALIZE: "true"
      MONGO_DATABASE_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@127.0.0.1:47017/${MONGO_DATABASE_NAME}?authSource=admin
      FIREWALL_SOCKET: /run/porthub-firewall/api.sock
      PORTHUB_GATEWAY_CONFIG_PATH: /run/porthub-config/gateway.toml
      PORTHUB_WEB_ROUTES_CONFIG_PATH: /run/porthub-config/web-routes.json
      PORTHUB_WEB_ACTIVITY_LOG_PATH: /run/porthub-activity/web-activity.log
    volumes:
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/data:/data"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/api-socket:/run/porthub-api"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/edge-socket:/run/porthub-edge:ro"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/firewall-socket:/run/porthub-firewall"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/routing-config:/run/porthub-config"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/web-activity:/run/porthub-activity:ro"
    healthcheck:
      test: [CMD, porthub-runtime, check, --socket, /run/porthub-api/api.sock]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3
    depends_on:
      firewall: {condition: service_healthy}
    develop:
      watch:
        - {path: crates, action: sync+restart, target: /src/crates}
        - {path: vendor, action: rebuild}
        - {path: Cargo.toml, action: rebuild}
        - {path: Cargo.lock, action: rebuild}
        - {path: rust-toolchain.toml, action: rebuild}
        - {path: ui/src, action: sync, target: /app/ui-dev/src}
        - {path: ui/public, action: sync, target: /app/ui-dev/public}
        - {path: ui/package.json, action: rebuild}

  edge:
    <<: *common
    image: porthub:edge
    container_name: ${PORTHUB_CONTAINER_PREFIX:-porthub}-edge
    build:
      context: .
      target: ${PORTHUB_MODE:-prod}-edge
      args: {PORTHUB_VERSION: "${PORTHUB_VERSION:-1.7.0}", PORTHUB_SOURCE_REVISION: "${PORTHUB_SOURCE_REVISION:-unknown}", PORTHUB_BUILD_JOBS: "${PORTHUB_BUILD_JOBS:-4}"}
    network_mode: host
    cap_add: [NET_BIND_SERVICE]
    environment:
      PORTHUB_API_SOCKET: /run/porthub-api/api.sock
      PORTHUB_EDGE_SOCKET: /run/porthub-edge/control.sock
      PORTHUB_WEB_ROUTES_CONFIG_PATH: /run/porthub-config/web-routes.json
      PORTHUB_WEB_ACTIVITY_LOG_PATH: /run/porthub-activity/web-activity.log
      PORTHUB_EDGE_HTTP_LISTEN: ${PORTHUB_EDGE_HTTP_LISTEN:-0.0.0.0:80,0.0.0.0:8345}
      PORTHUB_EDGE_TLS_LISTEN: ${PORTHUB_EDGE_TLS_LISTEN-0.0.0.0:443,0.0.0.0:8346}
      PORTHUB_TLS_CERT: /data/certificates/origin.crt
      PORTHUB_TLS_KEY: /data/certificates/origin.key
      PORTHUB_ALLOW_SELF_SIGNED: ${PORTHUB_ALLOW_SELF_SIGNED:-true}
      PORT_HUB_PUBLIC_BASE_URL: ${PORT_HUB_PUBLIC_BASE_URL:-}
      PORT_HUB_HTTP_BASE_URL: ${PORT_HUB_HTTP_BASE_URL:-}
      PORT_HUB_FALLBACK_BASE_URLS: ${PORT_HUB_FALLBACK_BASE_URLS:-}
      PORTHUB_GATEWAY_ADVERTISED_URL: ${PORTHUB_GATEWAY_ADVERTISED_URL:-}
      PORT_HUB_SERVICE_DOMAIN: ${PORT_HUB_SERVICE_DOMAIN:-}
    volumes:
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/api-socket:/run/porthub-api:ro"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/edge-socket:/run/porthub-edge"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/routing-config:/run/porthub-config:ro"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/web-activity:/run/porthub-activity"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/certificates:/data/certificates"
    depends_on:
      core: {condition: service_healthy}
    healthcheck:
      test: [CMD, porthub-runtime, check, --listen-env, PORTHUB_EDGE_HTTP_LISTEN]
      interval: 30s
      timeout: 6s
      retries: 3
    develop:
      watch:
        - {path: crates, action: sync+restart, target: /src/crates}
        - {path: Cargo.toml, action: rebuild}
        - {path: Cargo.lock, action: rebuild}
        - {path: rust-toolchain.toml, action: rebuild}
        - {path: vendor/rathole, action: rebuild}

  firewall:
    <<: *common
    image: porthub:firewall
    container_name: ${PORTHUB_CONTAINER_PREFIX:-porthub}-firewall
    build:
      context: .
      target: ${PORTHUB_MODE:-prod}-firewall
      args: {PORTHUB_VERSION: "${PORTHUB_VERSION:-1.7.0}", PORTHUB_SOURCE_REVISION: "${PORTHUB_SOURCE_REVISION:-unknown}", PORTHUB_BUILD_JOBS: "${PORTHUB_BUILD_JOBS:-4}"}
    network_mode: host
    cap_add: [NET_ADMIN]
    environment:
      FW_API_KEY: ${FW_API_KEY:?Set FW_API_KEY in .env}
      FW_NFT_TABLE: ${FW_NFT_TABLE:-inet porthub}
    volumes:
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/firewall-data:/data/firewall"
      - "${PORTHUB_VOLUME_ROOT:-./volumes/porthub}/firewall-socket:/run/porthub-firewall"
    healthcheck:
      test: [CMD, porthub-runtime, check, --socket, /run/porthub-firewall/api.sock, --path, /api/ping, --api-key-env, FW_API_KEY]
      interval: 30s
      timeout: 6s
      retries: 3
    develop:
      watch:
        - {path: crates, action: sync+restart, target: /src/crates}
        - {path: Cargo.toml, action: rebuild}
        - {path: Cargo.lock, action: rebuild}
        - {path: rust-toolchain.toml, action: rebuild}
        - {path: vendor, action: rebuild}
