# PortHub server: a single container running the API, web app, database,
# web proxy, tunnel server, firewall and private-network relay.
# Mode: PORTHUB_MODE=prod (default) or dev in .env.
#   docker compose up -d --build
services:
  porthub:
    build:
      context: .
      args:
        PORTHUB_VERSION: ${PORTHUB_VERSION:-dev} # set by deploy.sh (git commit)
    image: porthub:latest
    container_name: porthub
    network_mode: host # binds 80/443 (web), 8345/8346 (app), tunnel ports
    cap_add:
      - NET_ADMIN # firewall rules and traffic counters
      - NET_RAW
    env_file:
      - ./.env
    environment:
      PORTHUB_MODE: ${PORTHUB_MODE:-prod}
      MONGO_DATABASE_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@127.0.0.1:47017/${MONGO_DATABASE_NAME}?authSource=admin
      FIREWALL_BASE_URL: http://127.0.0.1:47001/api
      RATHOLE_SERVER_CONFIG_PATH: /runtime/rathole/server.toml
      TRAEFIK_DYNAMIC_CONFIG_PATH: /runtime/traefik/traffic-routes.yml
      FW_DB_PATH: /data/firewall/firewall.db
    volumes:
      - porthub_data:/data
      - ./api:/app/api # API runs from the checkout (as before)
      - ./ui:/app/ui-src # used only in dev mode
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  porthub_data:
