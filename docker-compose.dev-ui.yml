# Local UI iteration on the normal application URL (including the existing API).
# docker compose -f docker-compose-services.yml -f docker-compose-prod.yml -f docker-compose.dev-ui.yml up -d --no-deps ui
services:
  ui:
    command: ["yarn", "next", "dev", "--port", "3000"]
    environment:
      NODE_ENV: development
      BUILD_ENV: dev
      NEXT_BUILD_DIR: .next-dev-local
      PORTHUB_DEV_BACKEND_URL: ""
    volumes:
      - ./ui:/app
