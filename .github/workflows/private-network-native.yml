name: Private network native recovery
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed 40-character source commit (empty uses workflow commit)
        type: string
        default: ''
      execute:
        description: Run native recovery fixtures on disposable hosted runners
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    if: inputs.execute == true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            contract: linux
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            contract: windows
          - runner: macos-15
            target: aarch64-apple-darwin
            contract: macos
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PORTHUB_NATIVE_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      PORTHUB_NATIVE_CONTROLLER_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '33554432'
      RUSTFLAGS: ${{ matrix.contract == 'windows' && '-C target-feature=+crt-static' || '' }}
    steps:
      - name: Require immutable source
        run: '[[ "$PORTHUB_NATIVE_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PORTHUB_NATIVE_SOURCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixture source without native operations
        run: python scripts/private-sparse-native-lifecycle.py --contract '${{ matrix.contract }}' --validate-source-only
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 '${{ matrix.target }}'
          test "$(rustc +1.99.1 -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - name: Install Linux terminal build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison ncurses-bin
      - uses: Swatinem/rust-cache@v2
        with:
          key: private-native-${{ matrix.target }}
          cache-workspace-crates: true
      - name: Prepare bundled terminal runtime
        if: runner.os != 'Windows'
        run: |
          terminal_bundle="$(python scripts/build-terminal-helper.py --target '${{ matrix.target }}')"
          echo "PORTHUB_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo "PORTHUB_TEST_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo "PORTHUB_TEST_TERMINAL_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Build actual native test executable
        run: cargo +1.99.1 test --locked -p porthub-agent --lib --features private-sparse --target '${{ matrix.target }}' --no-run --message-format=json > native-build.jsonl 2> native-build.stderr.log
      - name: Exercise native recovery and verify cleanup
        run: |
          if [[ '${{ matrix.contract }}' == windows ]]; then
            python scripts/private-sparse-native-lifecycle.py --contract windows --build-json native-build.jsonl --purpose reviewed-disposable-sparse-lifecycle-v1 --outer-timeout-seconds 180 --log-cap-bytes 1048576
          else
            sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
              PORTHUB_NATIVE_SOURCE_REVISION="$PORTHUB_NATIVE_SOURCE_REVISION" \
              PORTHUB_NATIVE_CONTROLLER_REVISION="$PORTHUB_NATIVE_CONTROLLER_REVISION" \
              "$(command -v python)" scripts/private-sparse-native-lifecycle.py \
              --contract '${{ matrix.contract }}' --build-json native-build.jsonl \
              --purpose reviewed-disposable-sparse-lifecycle-v1 --outer-timeout-seconds 180 --log-cap-bytes 1048576
          fi
      - name: Retain build and native cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-native-${{ matrix.contract }}-${{ github.run_attempt }}
          path: |
            native-build.jsonl
            native-build.stderr.log
            private-sparse-native-receipts/
            target/terminal-helper/**/build.log
          if-no-files-found: warn
          retention-days: 7
