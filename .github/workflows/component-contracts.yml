name: Component contracts and downloads
on:
  push:
    branches: [main, codex/on-demand-components]
    paths:
      - 'crates/porthub-components/**'
      - 'crates/porthub-sync/**'
      - 'crates/porthub-tor/**'
      - 'crates/porthub-egress/**'
      - 'crates/porthub-transfer/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/component-contracts.yml'
  pull_request:
    paths:
      - 'crates/porthub-components/**'
      - 'crates/porthub-sync/**'
      - 'crates/porthub-tor/**'
      - 'crates/porthub-egress/**'
      - 'crates/porthub-transfer/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/component-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: component-contracts-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: components-${{ runner.arch }}
      - name: Test compatibility, download verification and IPC limits
        run: cargo test --locked -p porthub-components -p porthub-sync
      - name: Verify independent Tor worker and source-policy lifecycle
        run: cargo test --locked -p porthub-tor
      - name: Verify transfers compile and run without watch synchronization
        run: cargo test --locked -p porthub-transfer --no-default-features
