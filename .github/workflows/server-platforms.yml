name: Native server artifacts
on:
  workflow_call:
    inputs:
      revision:
        type: string
        default: ''
      platform:
        type: string
        default: arm64
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to package (defaults to this workflow commit)
        type: string
        default: ''
      platform:
        description: Server architecture to build (agents are not rebuilt)
        type: choice
        options: [arm64, x86_64, all]
        default: arm64
permissions:
  contents: read
jobs:
  terminal-measurements:
    name: Verify terminal sharing and account measurements
    needs: [ui]
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      PORTHUB_TERMINAL_HELPER_CACHE_ROOT: ${{ github.workspace }}/.cache/terminal-helper
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install pinned test toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: terminal-measurements
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Verify strict reports and real standalone MongoDB rollups
        env:
          PORTHUB_TEST_MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}
        run: |
          cargo test --locked -p porthub-terminal --lib
          cargo test --locked -p porthub-api --lib release_cache::tests -- --test-threads=1
          cargo test --locked -p porthub-api --lib artifacts::compact_tests
          cargo test --locked -p porthub-api --lib terminal_traffic -- --include-ignored
          cargo test --locked -p porthub-api --lib inventory_ -- --include-ignored
          cargo test --locked -p porthub-api --test terminal_traffic --test machine_delete --test admin_users --test firewall_history --test inventory_query -- --include-ignored
          cargo test --locked -p porthub-firewall --test store
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: porthub-server-ui
          path: terminal-browser-assets
      - name: Verify browser assets match the tested source
        run: |
          test "$(cat terminal-browser-assets/source-revision)" = "$PORTHUB_SOURCE_REVISION"
          (cd terminal-browser-assets && sha256sum --check --quiet SHA256SUMS)
      - name: Install isolated browser and terminal build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison ncurses-bin
          npm install --prefix "$RUNNER_TEMP/terminal-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.64.1
          node "$RUNNER_TEMP/terminal-browser-tools/node_modules/playwright/cli.js" install --with-deps webkit
      - uses: actions/cache@v4
        with:
          path: .cache/terminal-helper
          key: terminal-v1-${{ runner.os }}-x86_64-unknown-linux-gnu-${{ hashFiles('vendor/terminal/sources.json', 'scripts/build-terminal-helper.py') }}
      - name: Build the native fixture with its bundled terminal
        run: |
          terminal_bundle="$(python3 scripts/build-terminal-helper.py --target x86_64-unknown-linux-gnu)"
          echo "PORTHUB_TEST_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo 'PORTHUB_TEST_TERMINAL_TARGET=x86_64-unknown-linux-gnu' >> "$GITHUB_ENV"
          echo "PORTHUB_TEST_AGENT_EXECUTABLE=$GITHUB_WORKSPACE/target/debug/porthub" >> "$GITHUB_ENV"
          PORTHUB_TERMINAL_BUNDLE="$terminal_bundle" cargo build --locked -p porthub-agent --features terminal-direct
      - name: Verify real SSH, Chrome and WebKit guests over direct and fallback paths
        env:
          PORTHUB_TEST_MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}
          NODE_PATH: ${{ runner.temp }}/terminal-browser-tools/node_modules
        run: python3 scripts/test-terminal-browser-integration.py --ui-root terminal-browser-assets/ui
  ui:
    name: Build and test production browser assets
    runs-on: ubuntu-24.04
    env:
      SOURCE_REVISION: ${{ inputs.revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned UI package manager
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ui-yarn
            ui/.next/cache
          key: production-ui-${{ runner.os }}-${{ hashFiles('ui/yarn.lock') }}-${{ github.sha }}
          restore-keys: production-ui-${{ runner.os }}-${{ hashFiles('ui/yarn.lock') }}-
      - name: Build exported UI once for all server architectures
        working-directory: ui
        run: |
          yarn install --frozen-lockfile --cache-folder ../.cache/ui-yarn --network-timeout 120000 --network-concurrency 4
          yarn build
          yarn next export --outdir ../ui-artifacts/ui
      - name: Exercise the exported terminal in a real browser
        run: python3 scripts/test-terminal-production-ui.py --root ui-artifacts/ui
      - name: Verify and compress reusable browser assets
        run: |
          find ui-artifacts/ui -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.svg' \) -exec gzip --keep -9 {} +
          printf '%s\n' "$SOURCE_REVISION" > ui-artifacts/source-revision
          (cd ui-artifacts && find ui -type f -print0 | sort -z | xargs -0 sha256sum) > ui-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: porthub-server-ui
          path: ui-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  server:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'all' && '[{"arch":"arm64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"},{"arch":"x86_64","os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl"}]' || inputs.platform == 'x86_64' && '[{"arch":"x86_64","os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl"}]' || '[{"arch":"arm64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      RUST_MIN_STACK: '33554432'
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install pinned native static toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 '${{ matrix.target }}'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Build server roles without rebuilding agents
        run: |
          target='${{ matrix.target }}'
          target_key="$(echo "$target" | tr '[:lower:]-' '[:upper:]_')"
          cc_key="$(echo "$target" | tr '-' '_')"
          export "CARGO_TARGET_${target_key}_LINKER=musl-gcc"
          export "CC_${cc_key}=musl-gcc"
          cargo build --locked --release -p porthub-api -p porthub-edge -p porthub-runtime -p porthub-firewall --target "$target" --timings
          cargo test --locked -p porthub-edge --target "$target"
          mkdir -p server-artifacts
          for binary in porthub-api porthub-edge porthub-runtime porthub-firewall; do
            source="target/$target/release/$binary"
            readelf -l "$source" > "$RUNNER_TEMP/$binary.elf"
            if grep -q INTERP "$RUNNER_TEMP/$binary.elf"; then
              echo "$binary requires a dynamic loader" >&2
              exit 1
            fi
            "$source" --help >/dev/null
            cp "$source" server-artifacts/
          done
          printf '%s\n' "$PORTHUB_SOURCE_REVISION" > server-artifacts/source-revision
          (cd server-artifacts && sha256sum porthub-*) > server-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: porthub-server-${{ matrix.arch }}
          path: server-artifacts/
          if-no-files-found: error
          retention-days: 3
  package:
    name: Package server runtime images
    needs: [server, ui, terminal-measurements]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'all' && '[{"arch":"arm64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"},{"arch":"x86_64","os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl"}]' || inputs.platform == 'x86_64' && '[{"arch":"x86_64","os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl"}]' || '[{"arch":"arm64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: porthub-server-${{ matrix.arch }}
          path: deploy/native/server-bin
      - uses: actions/download-artifact@v4
        with:
          name: porthub-server-ui
          path: deploy/native/ui-bin
      - name: Verify tested production UI artifacts
        env:
          EXPECTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          test "$(cat deploy/native/ui-bin/source-revision)" = "$EXPECTED_REVISION"
          (cd deploy/native/ui-bin && sha256sum --check SHA256SUMS)
      - name: Verify pinned native server artifacts
        env:
          EXPECTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          test "$(cat deploy/native/server-bin/source-revision)" = "$EXPECTED_REVISION"
          (cd deploy/native/server-bin && sha256sum --check SHA256SUMS)
          chmod 0755 deploy/native/server-bin/porthub-*
      - uses: docker/setup-buildx-action@v3
      - name: Package and smoke test each runtime role
        env:
          SOURCE_REVISION: ${{ inputs.revision || github.sha }}
          SERVER_ARCH: ${{ matrix.arch }}
        run: |
          version="$(sh scripts/release-version.sh)"
          mkdir -p server-images
          for role in core edge firewall; do
            image="porthub-ci:${role}-${SOURCE_REVISION}"
            docker buildx build --load --target "prod-$role" --tag "$image"               --build-arg PORTHUB_SERVER_ARTIFACT_SOURCE=prebuilt-server               --build-arg PORTHUB_CORE_ARTIFACT_SOURCE=prebuilt-server               --build-arg PORTHUB_UI_ARTIFACT_SOURCE=prebuilt-ui               --build-arg "PORTHUB_VERSION=$version"               --build-arg "PORTHUB_SOURCE_REVISION=$SOURCE_REVISION"               --cache-from "type=gha,scope=server-${SERVER_ARCH}-${role}"               --cache-to "type=gha,scope=server-${SERVER_ARCH}-${role},mode=max" .
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$SOURCE_REVISION"
            case "$role" in core) binary=porthub-api; expected_user=10001:10001 ;; edge) binary=porthub-edge; expected_user=0:10001 ;; firewall) binary=porthub-firewall; expected_user=0:10001 ;; esac
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "$expected_user"
            docker run --rm --network none --cap-drop ALL --entrypoint "$binary" "$image" --help
            docker run --rm --network none --cap-drop ALL --entrypoint porthub-runtime "$image" --help
            docker save "$image" | gzip -1 > "server-images/$role.tar.gz"
          done
          printf '%s\n' "$SOURCE_REVISION" > server-images/source-revision
          printf '%s\n' "$version" > server-images/version
          (cd server-images && sha256sum *.tar.gz) > server-images/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: porthub-server-images-${{ matrix.arch }}
          path: server-images/
          if-no-files-found: error
          retention-days: 3
