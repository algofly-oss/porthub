name: Native server artifacts
on:
  workflow_call:
    inputs:
      revision:
        type: string
        default: ''
      platform:
        type: string
        default: arm64
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to package (defaults to this workflow commit)
        type: string
        default: ''
      platform:
        description: Server architecture to build (agents are not rebuilt)
        type: choice
        options: [arm64, x86_64, all]
        default: arm64
permissions:
  contents: read
jobs:
  keyboard-firmware:
    name: Build reusable browser HID firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/cache@v4
        with:
          path: |
            firmware/keyboard/build
            firmware/keyboard/managed_components
          key: keyboard-idf-5.4.2-${{ hashFiles('firmware/keyboard/main/**', 'firmware/keyboard/sdkconfig*', 'firmware/keyboard/CMakeLists.txt') }}
          restore-keys: keyboard-idf-5.4.2-
      - name: Build both chips without adding a runtime service
        run: python3 scripts/build-keyboard-firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: porthub-keyboard-firmware
          path: ui/public/keyboard-firmware/
          if-no-files-found: error
          retention-days: 3
  terminal-measurements:
    name: Verify terminal sharing and account measurements
    needs: [ui]
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      PORTHUB_TERMINAL_HELPER_CACHE_ROOT: ${{ github.workspace }}/.cache/terminal-helper
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install pinned test toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
      - uses: Swatinem/rust-cache@v2
        with:
          key: terminal-measurements-portable-cpu-v1
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Pin explicit portable speech CPU policy for cached native builds
        run: echo "TRANSCRIBE_CMAKE_ARGS=$(sh scripts/speech-cpu-policy.sh x86_64-unknown-linux-gnu)" >> "$GITHUB_ENV"
      - name: Verify strict reports and real standalone MongoDB rollups
        env:
          PORTHUB_TEST_MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}
        run: |
          python3 scripts/test_speech_cpu_policy.py
          cargo test --locked -p porthub-api --test speech_portability speech_backend_devices_enumerate_without_model_or_application -- --ignored --exact --nocapture
          cargo test --locked -p porthub-forward-ssh
          cargo test --locked -p porthub-api --test port_forwards -- --include-ignored
          cargo test --locked -p porthub-api --lib port_forward -- --include-ignored
          cargo test --locked -p porthub-agent --lib private_network::port_forwards
          cargo test --locked -p porthub-edge --test forward_bridge
          cargo test --locked -p porthub-edge --test embedded_client ssh_import_uses_exact_authenticated_control_channel
          broker_test=$(cargo test --locked -p porthub-forward-ssh --test openssh --no-run --message-format=json | jq -r 'select(.executable != null) | .executable')
          PORTHUB_FORWARD_BROKER_TEST="$broker_test" node --test ui/tests/port-forwards-command.test.mjs
          cargo test --locked -p porthub-terminal --lib
          cargo test --locked -p porthub-runtime --lib web_activity::tests
          cargo test --locked -p porthub-runtime --test upstreams
          cargo test --locked -p porthub-api --lib web_activity::tests
          cargo test --locked -p porthub-api --lib domain::machine_client::auto_update_tests
          cargo test --locked -p porthub-api --test machine_client session_sync_and_files_preserve_updates_overrides_authentication_and_deletion -- --include-ignored
          cargo test --locked -p porthub-api --test machine_client newer_prerelease_supersedes_old_update_without_faking_a_commit -- --include-ignored
          cargo test --locked -p porthub-api --test workflows native_web_activity -- --include-ignored
          cargo test --locked -p porthub-api --lib traffic_hover::tests
          cargo test --locked -p porthub-api --test traffic_hover -- --include-ignored --nocapture
          cargo test --locked -p porthub-api --lib hosted_images
          cargo test --locked -p porthub-api --test hosted_images -- --include-ignored
          cargo test --locked -p porthub-api --test image_rooms -- --include-ignored
          cargo test --locked -p porthub-api --test large_images -- --include-ignored
          cargo test --locked -p porthub-api --test boards --test file_relay --test pairdrop -- --include-ignored
          cargo test --locked -p porthub-api --lib file_relay::tests
          cargo test --locked -p porthub-api --test keyboard --test machine_metrics --test usb -- --include-ignored
          cargo test --locked -p porthub-api --lib domain::private_networks::tests
          cargo test --locked -p porthub-api --test private_network_ranges --test private_sync -- --include-ignored
          cargo test --locked -p porthub-mesh --lib traffic_report::tests
          cargo test --locked -p porthub-agent --lib private_network::traffic::tests
          cargo test --locked -p porthub-api --test private_traffic -- --include-ignored --nocapture
          cargo test --locked -p porthub-api --test workflows machine_creation_enrolls_privately_and_checks_group_ownership -- --include-ignored
          cargo test --locked -p porthub-api --lib native_media::
          # The real inventory DTO case needs an operator's physical microphone;
          # hosted CI runs the portable API contracts, not that hardware gate.
          cargo test --locked -p porthub-api --test native_media -- --include-ignored --skip real_readonly_helper_inventory_allows_explicit_unknown_permission_but_never_denied_or_camera
          cargo test --locked -p porthub-components --test media_distribution
          cargo test --locked -p porthub-agent --lib autoupdate::version_tests
          cargo test --locked -p porthub-components --lib release_version
          cargo test --locked -p porthub-agent --lib usb::
          cargo test --locked -p porthub-components --lib usb::
          cargo test --locked -p porthub-agent --lib features::
          cargo test --locked -p porthub-components --lib keyboard
          cargo test --locked -p porthub-components --lib metrics
          cargo test --locked -p porthub-agent --lib image
          cargo test --locked -p porthub-agent --lib forward::tests
          cargo test --locked -p porthub-agent --bin porthub forward_defaults
          cargo test --locked -p porthub-agent --test forward_recovery
          cargo test --locked -p porthub-api --lib release_cache::tests -- --test-threads=1
          cargo test --locked -p porthub-api --lib artifacts::compact_tests
          cargo test --locked -p porthub-api --lib terminal_traffic -- --include-ignored
          cargo test --locked -p porthub-api --lib inventory_ -- --include-ignored
          cargo test --locked -p porthub-api --test terminal_traffic --test machine_delete --test admin_users --test firewall_history --test inventory_query -- --include-ignored
          cargo test --locked -p porthub-firewall --test store
      - name: Verify actual private carrier telemetry through the API
        env:
          PORTHUB_TEST_MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}
        run: |
          cargo test --locked -p porthub-agent --lib --no-run --message-format=json > /tmp/private-traffic-agent-unit.jsonl
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          matches=set()
          for line in Path('/tmp/private-traffic-agent-unit.jsonl').read_text().splitlines():
              row=json.loads(line)
              if row.get('reason')=='compiler-artifact' and row.get('target',{}).get('name')=='porthub_agent' and row.get('target',{}).get('kind')==['lib'] and row.get('profile',{}).get('test') is True and row.get('executable'):
                  matches.add(row['executable'])
          assert len(matches)==1, 'Expected one exact compiled agent unit executable'
          executable=Path(matches.pop()).resolve(strict=True)
          assert executable.is_file() and executable.name.startswith('porthub_agent-')
          Path('/tmp/private-traffic-agent-executable').write_text(str(executable))
          PY
          export PORTHUB_TEST_AGENT_UNIT_EXECUTABLE="$(cat /tmp/private-traffic-agent-executable)"
          cargo test --locked -p porthub-api --test private_traffic_carriers actual_agent_direct_and_gateway_tx_are_automatically_uploaded_to_owner_history -- --ignored --exact --nocapture
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: porthub-server-ui
          path: terminal-browser-assets
      - name: Verify browser assets match the tested source
        run: |
          test "$(cat terminal-browser-assets/source-revision)" = "$PORTHUB_SOURCE_REVISION"
          (cd terminal-browser-assets && sha256sum --check --quiet SHA256SUMS)
      - name: Install terminal build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison ncurses-bin aria2 cmake g++ xvfb
      - name: Install isolated Playwright package
        run: npm install --prefix "$RUNNER_TEMP/terminal-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.64.1 fflate@0.8.2
      - name: Install WebKit and system dependencies
        run: node "$RUNNER_TEMP/terminal-browser-tools/node_modules/playwright/cli.js" install --with-deps webkit
      - uses: actions/cache@v4
        with:
          path: .cache/terminal-helper
          key: terminal-v1-${{ runner.os }}-x86_64-unknown-linux-gnu-${{ hashFiles('vendor/terminal/sources.json', 'scripts/build-terminal-helper.py') }}
      - name: Build native core and independent browser-fixture helpers
        run: |
          terminal_bundle="$(python3 scripts/build-terminal-helper.py --target x86_64-unknown-linux-gnu)"
          echo "PORTHUB_TEST_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo 'PORTHUB_TEST_TERMINAL_TARGET=x86_64-unknown-linux-gnu' >> "$GITHUB_ENV"
          echo "PORTHUB_TEST_AGENT_EXECUTABLE=$GITHUB_WORKSPACE/target/debug/porthub" >> "$GITHUB_ENV"
          PORTHUB_TERMINAL_BUNDLE="$terminal_bundle" cargo build --locked -p porthub-agent --features terminal-direct
          PORTHUB_TERMINAL_BUNDLE="$terminal_bundle" cargo build --locked -p porthub-terminal-cli
          cargo build --locked -p porthub-stats
          cargo build --locked -p porthub-sync
          component_cache="$RUNNER_TEMP/porthub-server-browser-components"
          python3 scripts/seed-component-fixture.py --cache "$component_cache" --target x86_64-unknown-linux-gnu --core "$(sh scripts/release-version.sh)" --revision "$PORTHUB_SOURCE_REVISION" --input terminal "$GITHUB_WORKSPACE/target/debug/porthub-terminal" --input stats "$GITHUB_WORKSPACE/target/debug/porthub-stats" --input sync "$GITHUB_WORKSPACE/target/debug/porthub-sync"
          echo "PORTHUB_COMPONENT_CACHE=$component_cache" >> "$GITHUB_ENV"
          echo "PORTHUB_COMPONENT_SHARED_CACHE=off" >> "$GITHUB_ENV"
          echo "PORTHUB_COMPONENT_SOURCE=github" >> "$GITHUB_ENV"
      - name: Verify saved boards, browser shares and anonymous PairDrop
        env:
          PORTHUB_TEST_MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}
          PORTHUB_TEST_PAIRDROP_UPSTREAM: http://127.0.0.1:4319/
          NODE_PATH: ${{ runner.temp }}/terminal-browser-tools/node_modules
          PORTHUB_TEST_BOARD_UI_ROOT: ${{ github.workspace }}/terminal-browser-assets/ui
        run: |
          docker build -f deploy/pairdrop/Dockerfile -t porthub-pairdrop:browser-test .
          docker run -d --rm --name porthub-pairdrop-browser-test --read-only --cap-drop ALL --security-opt no-new-privileges:true --user 10001:10001 --memory=384m --pids-limit=64 -p 127.0.0.1:4319:3000 porthub-pairdrop:browser-test
          trap 'docker rm -f porthub-pairdrop-browser-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4319/config >/dev/null && break; sleep 1; done
          cargo test --locked -p porthub-api --test boards_browser -- --include-ignored --nocapture
      - name: Verify native VKeyboard input and local revocation in a browser
        env:
          PORTHUB_TEST_MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}
          NODE_PATH: ${{ runner.temp }}/terminal-browser-tools/node_modules
          PORTHUB_TEST_BOARD_UI_ROOT: ${{ github.workspace }}/terminal-browser-assets/ui
        run: |
          node ui/tests/keyboard-gestures.cjs
          node ui/tests/keyboard-surface-lifecycle.cjs
          cargo test --locked -p porthub-api --test keyboard_browser -- --include-ignored --nocapture
      - name: Verify phone layouts and native media controls in Chromium and WebKit
        env:
          NODE_PATH: ${{ runner.temp }}/terminal-browser-tools/node_modules
        run: python3 scripts/test-portal-production-ui.py --root terminal-browser-assets/ui
      - name: Verify retired shell endpoints
        run: cargo test --locked -p porthub-api --test terminal_retired
      - name: Retain failed phone layout geometry screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-phone-layout-diagnostics
          path: |
            /tmp/porthub-iphone-*.png
            /tmp/porthub-native-media-*.png
            /tmp/porthub-private-network-growth-*.png
          if-no-files-found: ignore
          retention-days: 3
  ui:
    needs: [keyboard-firmware]
    name: Build and test production browser assets
    runs-on: ubuntu-24.04
    env:
      SOURCE_REVISION: ${{ inputs.revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: porthub-keyboard-firmware
          path: ui/public/keyboard-firmware
      - name: Enable pinned UI package manager
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ui-yarn
            ui/.next/cache
          key: production-ui-${{ runner.os }}-${{ hashFiles('ui/yarn.lock') }}-${{ github.sha }}
          restore-keys: production-ui-${{ runner.os }}-${{ hashFiles('ui/yarn.lock') }}-
      - name: Build exported UI once for all server architectures
        working-directory: ui
        run: |
          yarn install --frozen-lockfile --cache-folder ../.cache/ui-yarn --network-timeout 120000 --network-concurrency 4
          yarn build
          yarn next export --outdir ../ui-artifacts/ui
      - name: Verify the retired terminal page is absent from the export
        run: |
          test -f ui-artifacts/ui/home.html
          test ! -e ui-artifacts/ui/terminal.html
          test ! -e ui-artifacts/ui/terminal/index.html
      - name: Verify and compress reusable browser assets
        run: |
          find ui-artifacts/ui -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.svg' \) -exec gzip --keep -9 {} +
          printf '%s\n' "$SOURCE_REVISION" > ui-artifacts/source-revision
          (cd ui-artifacts && find ui -type f -print0 | sort -z | xargs -0 sha256sum) > ui-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: porthub-server-ui
          path: ui-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  server-plan:
    name: Verify exact-source local server artifacts or select hosted fallback
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      hosted: ${{ steps.resolve.outputs.hosted }}
      hosted_count: ${{ steps.resolve.outputs.hosted_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Resolve trusted native server cohort
        id: resolve
        env:
          PORTHUB_NATIVE_BUILD_DEPOT_URL: ${{ vars.PORTHUB_TRUSTED_NATIVE_DEPOT }}
          SOURCE: ${{ inputs.revision || github.sha }}
          PLATFORM: ${{ inputs.platform }}
        run: >-
          python3 scripts/hybrid-server-build.py resolve --root "$GITHUB_WORKSPACE"
          --source-revision "$SOURCE" --platform "$PLATFORM" --output local-servers
          --depot "$PORTHUB_NATIVE_BUILD_DEPOT_URL"
      - uses: actions/upload-artifact@v4
        if: hashFiles('local-servers/arm64/server-artifacts/SHA256SUMS') != ''
        with:
          name: porthub-server-arm64
          path: local-servers/arm64/server-artifacts/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: hashFiles('local-servers/arm64/server-speech-probe/SHA256SUMS') != ''
        with:
          name: porthub-server-speech-probe-arm64
          path: local-servers/arm64/server-speech-probe/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: hashFiles('local-servers/x86_64/server-artifacts/SHA256SUMS') != ''
        with:
          name: porthub-server-x86_64
          path: local-servers/x86_64/server-artifacts/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: hashFiles('local-servers/x86_64/server-speech-probe/SHA256SUMS') != ''
        with:
          name: porthub-server-speech-probe-x86_64
          path: local-servers/x86_64/server-speech-probe/
          if-no-files-found: error
          retention-days: 3
  server:
    needs: [server-plan]
    if: needs.server-plan.outputs.hosted_count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.server-plan.outputs.hosted) }}
    runs-on: ${{ matrix.os }}
    env:
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      RUST_MIN_STACK: '33554432'
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}-portable-cpu-v1
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Install baseline x86 CPU emulator
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
      - name: Build server roles without rebuilding agents
        run: |
          target='${{ matrix.target }}'
          sh scripts/build-server-linux.sh "$target"
          mkdir -p server-artifacts
          for binary in porthub-api porthub-edge porthub-runtime porthub-firewall; do
            source="target/$target/release/$binary"
            readelf -l "$source" > "$RUNNER_TEMP/$binary.elf"
            if grep -q INTERP "$RUNNER_TEMP/$binary.elf" || readelf -d "$source" | grep -q NEEDED; then
              echo "$binary requires a dynamic loader" >&2
              exit 1
            fi
            "$source" --help >/dev/null
            cp "$source" server-artifacts/
          done
          printf '%s\n' "$PORTHUB_SOURCE_REVISION" > server-artifacts/source-revision
          (cd server-artifacts && sha256sum porthub-*) > server-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: porthub-server-${{ matrix.arch }}
          path: server-artifacts/
          if-no-files-found: error
          retention-days: 3
      - name: Upload isolated native speech probe (not a release asset)
        uses: actions/upload-artifact@v4
        with:
          name: porthub-server-speech-probe-${{ matrix.arch }}
          path: server-speech-probe/
          if-no-files-found: error
          retention-days: 3
  package:
    name: Package server runtime images
    needs: [server-plan, server, ui, terminal-measurements]
    if: >-
      always() && !cancelled() && needs.server-plan.result == 'success' &&
      needs.ui.result == 'success' && needs.terminal-measurements.result == 'success' &&
      (needs.server.result == 'success' ||
       (needs.server.result == 'skipped' && needs.server-plan.outputs.hosted_count == '0'))
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.server-plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: porthub-server-${{ matrix.arch }}
          path: deploy/native/server-bin
      - uses: actions/download-artifact@v4
        with:
          name: porthub-server-ui
          path: deploy/native/ui-bin
      - name: Verify tested production UI artifacts
        env:
          EXPECTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          test "$(cat deploy/native/ui-bin/source-revision)" = "$EXPECTED_REVISION"
          (cd deploy/native/ui-bin && sha256sum --check SHA256SUMS)
      - name: Verify pinned native server artifacts
        env:
          EXPECTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          test "$(cat deploy/native/server-bin/source-revision)" = "$EXPECTED_REVISION"
          (cd deploy/native/server-bin && sha256sum --check SHA256SUMS)
          chmod 0755 deploy/native/server-bin/porthub-*
      - uses: docker/setup-buildx-action@v3
      - name: Package and smoke test each runtime role
        env:
          SOURCE_REVISION: ${{ inputs.revision || github.sha }}
          SERVER_ARCH: ${{ matrix.arch }}
        run: |
          version="$(sh scripts/release-version.sh)"
          mkdir -p server-images
          for role in core edge firewall; do
            image="porthub-ci:${role}-${SOURCE_REVISION}"
            docker buildx build --load --target "prod-$role" --tag "$image"               --build-arg PORTHUB_SERVER_ARTIFACT_SOURCE=prebuilt-server               --build-arg PORTHUB_CORE_ARTIFACT_SOURCE=prebuilt-server               --build-arg PORTHUB_UI_ARTIFACT_SOURCE=prebuilt-ui               --build-arg "PORTHUB_VERSION=$version"               --build-arg "PORTHUB_SOURCE_REVISION=$SOURCE_REVISION"               --cache-from "type=gha,scope=server-${SERVER_ARCH}-${role}"               --cache-to "type=gha,scope=server-${SERVER_ARCH}-${role},mode=max" .
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$SOURCE_REVISION"
            case "$role" in core) binary=porthub-api; expected_user=10001:10001 ;; edge) binary=porthub-edge; expected_user=0:10001 ;; firewall) binary=porthub-firewall; expected_user=0:10001 ;; esac
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "$expected_user"
            docker run --rm --network none --cap-drop ALL --entrypoint "$binary" "$image" --help
            docker run --rm --network none --cap-drop ALL --entrypoint porthub-runtime "$image" --help
            docker save "$image" | gzip -1 > "server-images/$role.tar.gz"
          done
          printf '%s\n' "$SOURCE_REVISION" > server-images/source-revision
          printf '%s\n' "$version" > server-images/version
          (cd server-images && sha256sum *.tar.gz) > server-images/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: porthub-server-images-${{ matrix.arch }}
          path: server-images/
          if-no-files-found: error
          retention-days: 3
