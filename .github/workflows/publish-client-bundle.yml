name: Publish validated client bundle
on:
  workflow_call:
    inputs:
      revision:
        description: Exact prepared source already validated by the caller
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    name: Publish versioned GitHub release
    env:
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision }}
    concurrency:
      group: porthub-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Preserve default-branch-only release publication
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - name: Require the exact immutable prepared checkout
        run: |
          python3 - <<'PY_SOURCE'
          import os, re, subprocess
          source = os.environ['PORTHUB_SOURCE_REVISION']
          if not re.fullmatch('[a-f0-9]{40}', source): raise SystemExit('Invalid prepared source')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != source:
              raise SystemExit('Publication checkout differs from prepared source')
          PY_SOURCE
      - uses: actions/download-artifact@v4
        with:
          name: porthub-release-bundle
          path: release-assets
      - name: Verify publication and retry invariants
        run: python3 scripts/test_publish_release.py
      - name: Install trusted verifier toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: compact-publication-verifier-optimized
      - name: Build trusted compact artifact verifier
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --locked --release -p porthub-api --bin porthub-api
      - name: Publish all platform assets
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          PORTHUB_COMPACT_GATEWAY: ${{ vars.PORTHUB_RELEASE_GATEWAY || 'https://porthub.algofly.in' }}
        run: python3 scripts/publish-release.py --repository "$GITHUB_REPOSITORY" --assets release-assets --version "$(sh scripts/release-version.sh)" --revision "$PORTHUB_SOURCE_REVISION" --artifact-verifier "$GITHUB_WORKSPACE/target/release/porthub-api" --compact-gateway "$PORTHUB_COMPACT_GATEWAY" --execute
      - name: Retain latest release plus explicitly protected tags
        if: steps.publication.outputs.status != 'superseded'
        env:
          GH_TOKEN: ${{ github.token }}
          PORTHUB_RETAIN_TAGS: ${{ vars.PORTHUB_RETAIN_TAGS }}
        run: python3 scripts/prune-github-releases.py --repository "$GITHUB_REPOSITORY" --keep "v$(sh scripts/release-version.sh)" --expected-commit "$PORTHUB_SOURCE_REVISION" --remove-previews --execute
