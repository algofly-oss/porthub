name: Migration preflight
on:
  push:
    paths: ["deploy/native/*.py", ".github/workflows/migration-preflight.yml"]
  pull_request:
    paths: ["deploy/native/*.py", ".github/workflows/migration-preflight.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release validation and interrupted-stop recovery
        run: python3 -m unittest discover -s deploy/native -p 'test_*.py' -v
