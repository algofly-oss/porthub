name: Continuous release
on:
  workflow_call:
    inputs:
      verify_only:
        type: boolean
        default: true
      platform:
        type: string
        default: all
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'vendor/**'
      - 'ui/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/continuous-release.yml'
      - '.github/workflows/agent-platforms.yml'
      - '.github/workflows/server-platforms.yml'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Validate a branch without changing versions, publishing or deploying
        type: boolean
        default: true
      platform:
        description: Client platforms for validation; production releases always use all
        type: string
        default: all
permissions:
  contents: read
concurrency:
  group: porthub-continuous-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare immutable release source
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.release.outputs.revision || steps.validation.outputs.revision }}
      version: ${{ steps.release.outputs.version || steps.validation.outputs.version }}
      tag: ${{ steps.release.outputs.tag || steps.validation.outputs.tag }}
      skip: ${{ steps.release.outputs.skip || steps.validation.outputs.skip }}
      already_published: ${{ steps.release.outputs.already_published || steps.validation.outputs.already_published }}
      previous_components: ${{ steps.previous_builds.outputs.reuse_available || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify automatic version preparation and retention
        run: |
          python3 scripts/test_prepare_release.py
          python3 scripts/test_fetch_component_release.py
          python3 scripts/test_recover_component_builds.py
          python3 scripts/test_publish_release.py
          python3 scripts/test_prune_github_releases.py
          python3 scripts/test_reuse_client_artifacts.py
      - name: Pin validation source without release mutations
        id: validation
        if: github.event_name == 'workflow_dispatch' && inputs.verify_only == true
        run: |
          version="$(sh scripts/release-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "already_published=false" >> "$GITHUB_OUTPUT"
      - name: Inspect prior component release format
        id: previous_components
        if: github.event_name != 'workflow_dispatch' || inputs.verify_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-component-release.py --inspect-only
      - name: Install verifier toolchain for prior compact release
        if: steps.previous_components.outputs.compact == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        if: steps.previous_components.outputs.compact == 'true'
        with:
          key: release-preparation-verifier-optimized
      # Full-catalog hashing and decompression must fit the verifier's timeouts.
      - name: Build trusted artifact verifier
        if: steps.previous_components.outputs.compact == 'true'
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --locked --release -p porthub-api --bin porthub-api
      - name: Recover verified prior core build inputs
        id: previous_builds
        if: steps.previous_components.outputs.compact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-component-release.py --output "$RUNNER_TEMP/porthub-previous-release" --artifact-verifier "$GITHUB_WORKSPACE/target/release/porthub-api" --recover-output "$RUNNER_TEMP/porthub-previous-builds"
      - name: Pin the release version and source
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.verify_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          command = ['python3', 'scripts/prepare-release.py', '--default-branch', os.environ['DEFAULT_BRANCH'], '--execute']
          previous = pathlib.Path(os.environ['RUNNER_TEMP'])/'porthub-previous-builds'
          if previous.is_dir():
              for directory in sorted(previous.iterdir()):
                  command += ['--previous-core-build', str(directory)]
          subprocess.run(command, check=True)
          PY
      - name: Retain verified prior builds for x86_64
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-x86_64
          path: ${{ runner.temp }}/porthub-previous-builds/x86_64-unknown-linux-musl/
          if-no-files-found: error
          retention-days: 1
      - name: Retain verified prior builds for x86
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-x86
          path: ${{ runner.temp }}/porthub-previous-builds/i686-unknown-linux-musl/
          if-no-files-found: error
          retention-days: 1
      - name: Retain verified prior builds for arm64
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-arm64
          path: ${{ runner.temp }}/porthub-previous-builds/aarch64-unknown-linux-musl/
          if-no-files-found: error
          retention-days: 1
      - name: Retain verified prior builds for armhf
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-armhf
          path: ${{ runner.temp }}/porthub-previous-builds/arm-unknown-linux-musleabihf/
          if-no-files-found: error
          retention-days: 1
      - name: Retain verified prior builds for armv7
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-armv7
          path: ${{ runner.temp }}/porthub-previous-builds/armv7-unknown-linux-musleabihf/
          if-no-files-found: error
          retention-days: 1
      - name: Retain verified prior builds for darwin_x86_64
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-darwin_x86_64
          path: ${{ runner.temp }}/porthub-previous-builds/x86_64-apple-darwin/
          if-no-files-found: error
          retention-days: 1
      - name: Retain verified prior builds for darwin_arm64
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-darwin_arm64
          path: ${{ runner.temp }}/porthub-previous-builds/aarch64-apple-darwin/
          if-no-files-found: error
          retention-days: 1
      - name: Retain verified prior builds for windows_x86_64
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-windows_x86_64
          path: ${{ runner.temp }}/porthub-previous-builds/x86_64-pc-windows-msvc/
          if-no-files-found: error
          retention-days: 1
      - name: Retain verified prior builds for windows_x86
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-windows_x86
          path: ${{ runner.temp }}/porthub-previous-builds/i686-pc-windows-msvc/
          if-no-files-found: error
          retention-days: 1
      - name: Retain verified prior builds for windows_arm64
        if: steps.previous_builds.outputs.reuse_available == 'true' && steps.release.outputs.skip != 'true' && steps.release.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-reuse-windows_arm64
          path: ${{ runner.temp }}/porthub-previous-builds/aarch64-pc-windows-msvc/
          if-no-files-found: error
          retention-days: 1
  clients:
    name: Validate and package clients
    # The client workflow publishes after its platform gates. Require the
    # server's real browser/SSH/native-helper integration gate first as well.
    needs: [prepare, server]
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.already_published != 'true'
    uses: ./.github/workflows/agent-platforms.yml
    permissions:
      contents: write
      actions: read
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      previous_components: ${{ needs.prepare.outputs.previous_components == 'true' }}
      platform: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true && inputs.platform || 'all' }}
      verify_only: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true }}
      publish_release: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
  server:
    name: Build production server roles
    needs: [prepare]
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.already_published != 'true'
    uses: ./.github/workflows/server-platforms.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      platform: arm64
