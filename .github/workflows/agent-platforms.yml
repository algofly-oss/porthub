name: Native agent platforms
on:
  workflow_call:
    inputs:
      reuse_run_id:
        description: Reuse successful platforms from a completed run with identical production inputs
        type: string
        default: ''
      promote_run_id:
        description: Promote an already successful full run instead of rebuilding clients
        type: string
        default: ''
      revision:
        description: Exact prepared release commit
        type: string
        default: ''
      platform:
        type: string
        default: all
      verify_only:
        type: boolean
        default: false
      publish_release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Reuse successful platforms from a completed run with identical production inputs
        type: string
        default: ''
      promote_run_id:
        description: Optional successful full run ID to promote without rebuilding
        type: string
        default: ''
      platform:
        description: 'Platform artifact names (comma separated), windows, or all'
        default: all
        type: string
      verify_only:
        description: 'Run platform tests and native service checks without building release artifacts'
        default: false
        type: boolean
      publish_release:
        description: 'Publish the complete validated bundle; retain only the latest version release/tag'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  promote-existing:
    if: inputs.promote_run_id != ''
    uses: ./.github/workflows/promote-client-release.yml
    permissions:
      contents: write
      actions: read
    with:
      run_id: ${{ inputs.promote_run_id }}
  select-platforms:
    if: inputs.promote_run_id == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      native: ${{ steps.reuse.outputs.native || steps.select.outputs.native }}
      linux: ${{ steps.reuse.outputs.linux || steps.select.outputs.linux }}
      has_native: ${{ steps.reuse.outputs.has_native || steps.select.outputs.has_native }}
      has_linux: ${{ steps.reuse.outputs.has_linux || steps.select.outputs.has_linux }}
      reuse_plan: ${{ steps.reuse.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Validate publishing scope
        if: inputs.publish_release == true
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$BUILD_PLATFORM" = all
          test "$VERIFY_ONLY" != true
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - name: Verify reusable production inputs and successful platform artifacts
        id: reuse
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.reuse_run_id }}
          BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          test "$BUILD_PLATFORM" = all
          test "$VERIFY_ONLY" != true
          python3 scripts/test_reuse_client_artifacts.py
          python3 scripts/reuse-client-artifacts.py --run-id "$SOURCE_RUN"
      - id: select
        if: inputs.reuse_run_id == ''
        env:
          PORTHUB_BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
        run: python3 scripts/select-agent-platforms.py
  release-bundle:
    name: Validate complete release bundle
    if: always() && inputs.verify_only != true && (inputs.platform == '' || inputs.platform == 'all') && needs.select-platforms.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.linux-32.result == 'success' || needs.linux-32.result == 'skipped')
    needs: [select-platforms, native, linux-32]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.native.result == 'success' || needs.linux-32.result == 'success'
        with:
          pattern: porthub-*
          path: release-platforms
      - name: Restore successful platforms with verified source and digest
        if: needs.select-platforms.outputs.reuse_plan != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PORTHUB_REUSE_PLAN: ${{ needs.select-platforms.outputs.reuse_plan }}
        run: python3 scripts/reuse-client-artifacts.py --download release-platforms
      - name: Retain platform reuse provenance
        if: needs.select-platforms.outputs.reuse_plan != ''
        uses: actions/upload-artifact@v4
        with:
          name: porthub-release-provenance
          path: release-provenance.json
          overwrite: true
          if-no-files-found: error
          retention-days: 3
      - name: Collect client assets without server artifact collisions
        run: python3 deploy/native/collect_client_bundle.py --source release-platforms --destination release-input --version "$(sh scripts/release-version.sh)"
      - name: Validate all platforms against the workspace release
        shell: bash
        run: python3 deploy/native/stage_client_bundle.py --source release-input --version "$(sh scripts/release-version.sh)"
      - uses: actions/upload-artifact@v4
        with:
          name: porthub-release-bundle
          path: deploy/native/client-bin/
          if-no-files-found: error
          retention-days: 3
  publish-release:
    name: Publish versioned GitHub release
    if: inputs.verify_only != true && inputs.publish_release == true
    needs: [release-bundle]
    env:
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
    concurrency:
      group: porthub-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: porthub-release-bundle
          path: release-assets
      - name: Verify publication and retry invariants
        run: python3 scripts/test_publish_release.py
      - name: Publish all platform assets
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --repository "$GITHUB_REPOSITORY" --assets release-assets --version "$(sh scripts/release-version.sh)" --revision "$PORTHUB_SOURCE_REVISION" --execute
      - name: Retain latest release plus explicitly protected tags
        if: steps.publication.outputs.status != 'superseded'
        env:
          GH_TOKEN: ${{ github.token }}
          PORTHUB_RETAIN_TAGS: ${{ vars.PORTHUB_RETAIN_TAGS }}
        run: python3 scripts/prune-github-releases.py --repository "$GITHUB_REPOSITORY" --keep "v$(sh scripts/release-version.sh)" --expected-commit "$PORTHUB_SOURCE_REVISION" --remove-previews --execute
  native:
    needs: [select-platforms]
    if: needs.select-platforms.outputs.has_native == 'true'
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-platforms.outputs.native) }}
    runs-on: ${{ matrix.os }}
    env:
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      RUST_MIN_STACK: "33554432"
      PORTHUB_TERMINAL_HELPER_CACHE_ROOT: ${{ github.workspace }}/.cache/terminal-helper
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: ${{ contains(matrix.target, 'apple') && '2' || '4' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Read numeric release version
        shell: bash
        run: echo "PORTHUB_VERSION=$(sh scripts/release-version.sh)" >> "$GITHUB_ENV"
      - name: Install pinned Rust target
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 ${{ matrix.target }}
      - name: Prepare static Linux toolchain
        if: inputs.verify_only != true && runner.os == 'Linux'
        shell: bash
        run: |
          musl_target="$(echo '${{ matrix.target }}' | sed 's/-gnu$/-musl/')"
          rustup target add "$musl_target"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install terminal build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison ncurses-bin
      - name: Restore independent terminal runtime
        id: terminal_helper_cache
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: .cache/terminal-helper
          key: terminal-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('vendor/terminal/sources.json', 'scripts/build-terminal-helper.py') }}
      - name: Build or reuse bundled terminal runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          terminal_bundle="$(python3 scripts/build-terminal-helper.py --target '${{ matrix.target }}')"
          echo "PORTHUB_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo "PORTHUB_TEST_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo "PORTHUB_TEST_TERMINAL_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Cache completed terminal runtime before Rust checks
        if: runner.os != 'Windows' && steps.terminal_helper_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/terminal-helper
          key: ${{ steps.terminal_helper_cache.outputs.cache-primary-key }}
      - name: Save terminal helper failure log
        if: failure() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: terminal-helper-log-${{ matrix.artifact }}
          include-hidden-files: true
          path: |
            .cache/terminal-helper/**/build.log
            .cache/terminal-helper/**/config.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Cache compiled Rust dependencies and workspace libraries
        uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Verify terminal runtime survives Rust cache restoration
        if: runner.os != 'Windows'
        shell: bash
        run: test -s "$PORTHUB_TERMINAL_BUNDLE"
      - name: Compile focused Windows watch checks
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --locked -p porthub-transfer --no-run --target ${{ matrix.target }}
          cargo test --locked -p porthub-agent --test upload --no-run --target ${{ matrix.target }}
      - name: Verify Windows watch jobs with a bounded runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-transfer --target ${{ matrix.target }} -- --nocapture
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --test upload --target ${{ matrix.target }} -- --nocapture
      - name: Compile complete platform checks
        shell: bash
        run: cargo test --locked -p porthub-agent -p porthub-transfer -p porthub-tunnel -p porthub-identity -p porthub-mesh -p porthub-network -p porthub-io --target ${{ matrix.target }} --no-run
      - name: Test transfers, management and tunnel adapters
        shell: bash
        run: python scripts/run-with-timeout.py 240 cargo test --locked -p porthub-agent -p porthub-transfer -p porthub-tunnel -p porthub-identity -p porthub-mesh -p porthub-network -p porthub-io --target ${{ matrix.target }}
      - name: Gate Linux private-network prerequisite preparation and unified activation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --lib private_prerequisites --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --lib private_dns_setup --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --test service private_dependency_failure --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-network --lib expired_policy_fails_closed_with_an_actionable_clock_diagnostic --target ${{ matrix.target }}
      - name: Test packaged terminal runtime and ordinary SSH participation
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --locked -p porthub-terminal --features ssh --target ${{ matrix.target }} -- --include-ignored
      - name: Test experimental native terminal transports and recovery
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-terminal --features direct,viewer-history --lib direct::viewer --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-terminal --features direct,viewer-history --test native_direct --target ${{ matrix.target }} -- --include-ignored
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --features terminal-direct --lib terminal_ --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --no-default-features --lib terminal_policy --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --features terminal-direct --bin porthub cli_tests::native_terminal_join_is_opt_in_and_does_not_require_system_privileges --target ${{ matrix.target }}
      - name: Verify local terminals and native participant controls
        if: inputs.verify_only == true && runner.os != 'Windows'
        shell: bash
        env:
          PORTHUB_TEST_AGENT_EXECUTABLE: ${{ github.workspace }}/target/${{ matrix.target }}/debug/porthub
        run: |
          cargo test --locked -p porthub-agent --test terminal_local --test terminal_share --target ${{ matrix.target }} -- --include-ignored
          python3 scripts/test-stats-terminal.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
          python3 scripts/test-terminal-participants.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
      - name: Build self-contained agent
        if: inputs.verify_only != true && runner.os != 'Linux'
        shell: bash
        run: cargo build --locked --release -p porthub-agent --target ${{ matrix.target }}
      - name: Build static Linux agent bundle
        if: inputs.verify_only != true && runner.os == 'Linux'
        shell: bash
        run: |
          # Keep Cargo artifacts in the restored host cache instead of a fresh
          # Docker cache mount that disappears with each hosted runner.
          sh scripts/build-agent-linux.sh "$(echo '${{ matrix.target }}' | sed 's/-gnu$/-musl/')" '${{ matrix.artifact }}'
      - name: Prepare versioned artifact metadata
        if: inputs.verify_only != true && runner.os != 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, shutil
          source = pathlib.Path('target/${{ matrix.target }}/release/porthub${{ matrix.extension }}')
          output = pathlib.Path('dist/porthub-${{ matrix.artifact }}${{ matrix.extension }}')
          output.parent.mkdir(exist_ok=True)
          shutil.copy2(source, output)
          output.with_name(output.name+'.version').write_text(os.environ['PORTHUB_VERSION']+'\n')
          output.with_name(output.name+'.sha256').write_text(hashlib.sha256(output.read_bytes()).hexdigest()+'  '+output.name+'\n')
          PY
      - name: Test packaged HTTP server lifecycle
        if: inputs.verify_only != true
        shell: bash
        env:
          PORTHUB_TEST_AGENT_EXECUTABLE: ${{ github.workspace }}/dist/porthub-${{ matrix.artifact }}${{ matrix.extension }}
        run: cargo test --locked -p porthub-agent --test http_management --target ${{ matrix.target }}
      - name: Test packaged local terminal workspaces
        if: inputs.verify_only != true && runner.os != 'Windows'
        shell: bash
        env:
          PORTHUB_TEST_AGENT_EXECUTABLE: ${{ github.workspace }}/dist/porthub-${{ matrix.artifact }}${{ matrix.extension }}
        run: |
          cargo test --locked -p porthub-agent --test terminal_local --test terminal_share --target ${{ matrix.target }} -- --include-ignored
          python3 scripts/test-stats-terminal.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
          python3 scripts/test-terminal-participants.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
      - name: Test native macOS service lifecycle
        if: runner.os == 'macOS'
        shell: bash
        env:
          PORTHUB_TEST_LAUNCHD: "1"
        run: cargo test --locked -p porthub-agent --test launchd_live --target ${{ matrix.target }} -- --include-ignored
      - uses: actions/upload-artifact@v4
        if: inputs.verify_only != true
        with:
          name: porthub-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
  linux-32:
    needs: [select-platforms]
    if: needs.select-platforms.outputs.has_linux == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-platforms.outputs.linux) }}
    env:
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      RUST_MIN_STACK: "33554432"
      PORTHUB_TERMINAL_HELPER_CACHE_ROOT: ${{ github.workspace }}/.cache/terminal-helper
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Read numeric release version
        shell: bash
        run: echo "PORTHUB_VERSION=$(sh scripts/release-version.sh)" >> "$GITHUB_ENV"
      - name: Install build-only cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison ncurses-bin ${{ matrix.packages }}
      - run: rustup target add ${{ matrix.target }}
      - name: Restore independent cross-compiled terminal runtime
        id: terminal_helper_cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/terminal-helper
          key: terminal-v1-linux32-${{ matrix.target }}-${{ hashFiles('vendor/terminal/sources.json', 'scripts/build-terminal-helper.py') }}
      - name: Build or reuse cross-compiled terminal runtime
        shell: bash
        run: |
          terminal_bundle="$(python3 scripts/build-terminal-helper.py --target '${{ matrix.target }}' --cc '${{ matrix.compiler }}' --ar '${{ matrix.ar }}')"
          echo "PORTHUB_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
      - name: Cache completed cross-compiled terminal runtime before Rust checks
        if: steps.terminal_helper_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/terminal-helper
          key: ${{ steps.terminal_helper_cache.outputs.cache-primary-key }}
      - name: Save cross-compiled terminal helper failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-helper-log-${{ matrix.artifact }}
          include-hidden-files: true
          path: |
            .cache/terminal-helper/**/build.log
            .cache/terminal-helper/**/config.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Cache compiled 32-bit Rust libraries
        uses: Swatinem/rust-cache@v2
        with:
          key: linux32-${{ matrix.target }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Verify cross-compiled runtime survives Rust cache restoration
        shell: bash
        run: test -s "$PORTHUB_TERMINAL_BUNDLE"
      - name: Check agent for 32-bit Linux
        if: inputs.verify_only == true
        shell: bash
        run: |
          target_key=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          export "CARGO_TARGET_${target_key}_LINKER=${{ matrix.compiler }}"
          cc_target_key=$(echo '${{ matrix.target }}' | tr '-' '_')
          export "CC_${cc_target_key}=${{ matrix.compiler }}"
          export "AR_${cc_target_key}=${{ matrix.ar }}"
          cargo check --locked -p porthub-agent --all-targets --target ${{ matrix.target }}
      - name: Build agent for 32-bit Linux
        if: inputs.verify_only != true
        shell: bash
        run: |
          target_key=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          export "CARGO_TARGET_${target_key}_LINKER=${{ matrix.compiler }}"
          cc_target_key=$(echo '${{ matrix.target }}' | tr '-' '_')
          export "CC_${cc_target_key}=${{ matrix.compiler }}"
          export "AR_${cc_target_key}=${{ matrix.ar }}"
          cargo build --locked --release -p porthub-agent --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/porthub dist/porthub-${{ matrix.artifact }}
          printf '%s\n' "$PORTHUB_VERSION" > dist/porthub-${{ matrix.artifact }}.version
          cd dist && sha256sum porthub-${{ matrix.artifact }} > porthub-${{ matrix.artifact }}.sha256
      - name: Install native 32-bit x86 runtime libraries
        if: inputs.verify_only != true && matrix.artifact == 'x86'
        run: sudo apt-get install -y --no-install-recommends libc6-i386 lib32gcc-s1
      - name: Enable ARM user-mode execution on the isolated CI runner
        if: inputs.verify_only != true && matrix.artifact != 'x86'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Exercise packaged 32-bit CLI and embedded terminal runtime
        if: inputs.verify_only != true
        env:
          QEMU_LD_PREFIX: ${{ matrix.artifact != 'x86' && '/usr/arm-linux-gnueabihf' || '' }}
        run: python3 scripts/test-packaged-terminal-smoke.py "dist/porthub-${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        if: inputs.verify_only != true
        with:
          name: porthub-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
