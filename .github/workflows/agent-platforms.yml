name: Native agent platforms
on:
  workflow_call:
    inputs:
      previous_components:
        description: Reuse verified prior component inputs staged by this workflow run
        type: boolean
        default: false
      reuse_run_id:
        description: Reuse successful platforms from a completed run with identical production inputs
        type: string
        default: ''
      promote_run_id:
        description: Promote an already successful full run instead of rebuilding clients
        type: string
        default: ''
      revision:
        description: Exact prepared release commit
        type: string
        default: ''
      platform:
        type: string
        default: all
      verify_only:
        type: boolean
        default: false
      publish_release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Reuse successful platforms from a completed run with identical production inputs
        type: string
        default: ''
      promote_run_id:
        description: Optional successful full run ID to promote without rebuilding
        type: string
        default: ''
      platform:
        description: 'Platform artifact names (comma separated), windows, or all'
        default: all
        type: string
      verify_only:
        description: 'Run platform tests and native service checks without building release artifacts'
        default: false
        type: boolean
      publish_release:
        description: 'Publish the complete validated bundle; retain only the latest version release/tag'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  promote-existing:
    if: inputs.promote_run_id != ''
    uses: ./.github/workflows/promote-client-release.yml
    permissions:
      contents: write
      actions: read
    with:
      run_id: ${{ inputs.promote_run_id }}
  select-platforms:
    if: inputs.promote_run_id == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      native: ${{ steps.reuse.outputs.native || steps.select.outputs.native }}
      linux: ${{ steps.reuse.outputs.linux || steps.select.outputs.linux }}
      has_native: ${{ steps.reuse.outputs.has_native || steps.select.outputs.has_native }}
      has_linux: ${{ steps.reuse.outputs.has_linux || steps.select.outputs.has_linux }}
      reuse_plan: ${{ steps.reuse.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Verify pinned source download recovery
        run: python3 scripts/test_build_terminal_download.py
      - name: Validate publishing scope
        if: inputs.publish_release == true
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$BUILD_PLATFORM" = all
          test "$VERIFY_ONLY" != true
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - name: Verify reusable production inputs and successful platform artifacts
        id: reuse
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.reuse_run_id }}
          BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          test "$BUILD_PLATFORM" = all
          test "$VERIFY_ONLY" != true
          python3 scripts/test_reuse_client_artifacts.py
          python3 scripts/reuse-client-artifacts.py --run-id "$SOURCE_RUN"
      - id: select
        if: inputs.reuse_run_id == ''
        env:
          PORTHUB_BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
        run: python3 scripts/select-agent-platforms.py
  release-bundle:
    name: Validate complete release bundle
    if: always() && inputs.verify_only != true && (inputs.platform == '' || inputs.platform == 'all') && needs.select-platforms.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.linux-32.result == 'success' || needs.linux-32.result == 'skipped')
    needs: [select-platforms, native, linux-32]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.native.result == 'success' || needs.linux-32.result == 'success'
        with:
          pattern: porthub-*
          path: release-platforms
      - name: Restore successful platforms with verified source and digest
        if: needs.select-platforms.outputs.reuse_plan != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PORTHUB_REUSE_PLAN: ${{ needs.select-platforms.outputs.reuse_plan }}
        run: python3 scripts/reuse-client-artifacts.py --download release-platforms
      - name: Retain platform reuse provenance
        if: needs.select-platforms.outputs.reuse_plan != ''
        uses: actions/upload-artifact@v4
        with:
          name: porthub-release-provenance
          path: release-provenance.json
          overwrite: true
          if-no-files-found: error
          retention-days: 3
      - name: Verify compact release assembly
        run: python3 scripts/test_assemble_client_release.py
      - name: Install complete-bundle verifier toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: compact-publication-verifier
      - name: Build trusted complete-bundle verifier
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked -p porthub-api --bin porthub-api
      - name: Assemble and verify all ten platform artifacts
        run: python3 scripts/assemble-client-release.py --source release-platforms --destination release-assets --version "$(sh scripts/release-version.sh)" --artifact-verifier "$GITHUB_WORKSPACE/target/debug/porthub-api"
      - uses: actions/upload-artifact@v4
        with:
          name: porthub-release-bundle
          path: release-assets/
          if-no-files-found: error
          retention-days: 3
  publish-release:
    name: Publish versioned GitHub release
    if: inputs.verify_only != true && inputs.publish_release == true
    needs: [release-bundle]
    env:
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
    concurrency:
      group: porthub-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: porthub-release-bundle
          path: release-assets
      - name: Verify publication and retry invariants
        run: python3 scripts/test_publish_release.py
      - name: Install trusted verifier toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: compact-publication-verifier
      - name: Build trusted compact artifact verifier
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked -p porthub-api --bin porthub-api
      - name: Publish all platform assets
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          PORTHUB_COMPACT_GATEWAY: ${{ vars.PORTHUB_RELEASE_GATEWAY || 'https://porthub.algofly.in' }}
        run: python3 scripts/publish-release.py --repository "$GITHUB_REPOSITORY" --assets release-assets --version "$(sh scripts/release-version.sh)" --revision "$PORTHUB_SOURCE_REVISION" --artifact-verifier "$GITHUB_WORKSPACE/target/debug/porthub-api" --compact-gateway "$PORTHUB_COMPACT_GATEWAY" --execute
      - name: Retain latest release plus explicitly protected tags
        if: steps.publication.outputs.status != 'superseded'
        env:
          GH_TOKEN: ${{ github.token }}
          PORTHUB_RETAIN_TAGS: ${{ vars.PORTHUB_RETAIN_TAGS }}
        run: python3 scripts/prune-github-releases.py --repository "$GITHUB_REPOSITORY" --keep "v$(sh scripts/release-version.sh)" --expected-commit "$PORTHUB_SOURCE_REVISION" --remove-previews --execute
  native:
    needs: [select-platforms]
    if: needs.select-platforms.outputs.has_native == 'true'
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-platforms.outputs.native) }}
    runs-on: ${{ matrix.os }}
    env:
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      RUST_MIN_STACK: "33554432"
      PORTHUB_TERMINAL_HELPER_CACHE_ROOT: ${{ github.workspace }}/.cache/terminal-helper
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: ${{ contains(matrix.target, 'apple') && '2' || '4' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Restore verified prior component builds
        if: inputs.verify_only != true && inputs.previous_components == true
        uses: actions/download-artifact@v4
        with:
          name: component-reuse-${{ matrix.artifact }}
          path: ${{ runner.temp }}/porthub-component-reuse
      - name: Select verified prior component input directory
        if: inputs.verify_only != true && inputs.previous_components == true
        shell: bash
        run: echo "PORTHUB_PREVIOUS_COMPONENT_BUILDS=$RUNNER_TEMP/porthub-component-reuse" >> "$GITHUB_ENV"
      - name: Read numeric release version
        shell: bash
        run: echo "PORTHUB_VERSION=$(sh scripts/release-version.sh)" >> "$GITHUB_ENV"
      - name: Install pinned Rust target
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 ${{ matrix.target }}
      - name: Prepare static Linux toolchain
        if: inputs.verify_only != true && runner.os == 'Linux'
        shell: bash
        run: |
          musl_target="$(echo '${{ matrix.target }}' | sed 's/-gnu$/-musl/')"
          rustup target add "$musl_target"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install terminal build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison ncurses-bin
      - name: Restore independent terminal runtime
        id: terminal_helper_cache
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: .cache/terminal-helper
          key: terminal-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('vendor/terminal/sources.json', 'scripts/build-terminal-helper.py') }}
      - name: Build or reuse bundled terminal runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          terminal_bundle="$(python3 scripts/build-terminal-helper.py --target '${{ matrix.target }}')"
          echo "PORTHUB_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo "PORTHUB_TEST_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo "PORTHUB_TEST_TERMINAL_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Cache completed terminal runtime before Rust checks
        if: runner.os != 'Windows' && steps.terminal_helper_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/terminal-helper
          key: ${{ steps.terminal_helper_cache.outputs.cache-primary-key }}
      - name: Save terminal helper failure log
        if: failure() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: terminal-helper-log-${{ matrix.artifact }}
          include-hidden-files: true
          path: |
            .cache/terminal-helper/**/build.log
            .cache/terminal-helper/**/config.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Cache compiled Rust dependencies and workspace libraries
        uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Verify terminal runtime survives Rust cache restoration
        if: runner.os != 'Windows'
        shell: bash
        run: test -s "$PORTHUB_TERMINAL_BUNDLE"
      - name: Verify copied Windows installer in Command Prompt and both PowerShell versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-bootstrap-command.ps1
      - name: Build independent sync fixture for core command checks
        shell: bash
        run: |
          cargo build --locked -p porthub-sync --target ${{ matrix.target }}
          echo "PORTHUB_TEST_SYNC_EXECUTABLE=$GITHUB_WORKSPACE/target/${{ matrix.target }}/debug/porthub-sync${{ matrix.extension }}" >> "$GITHUB_ENV"
      - name: Build independent dashboard and terminal fixtures
        shell: bash
        run: |
          cargo build --locked -p porthub-stats --target ${{ matrix.target }}
          cargo build --locked -p porthub-terminal-cli --target ${{ matrix.target }}
          component_cache="$RUNNER_TEMP/porthub-native-components-${{ matrix.target }}"
          python scripts/seed-component-fixture.py --cache "$component_cache" --target '${{ matrix.target }}' --core "$(sh scripts/release-version.sh)" --revision "$(git rev-parse HEAD)" --input stats "$GITHUB_WORKSPACE/target/${{ matrix.target }}/debug/porthub-stats${{ matrix.extension }}" --input terminal "$GITHUB_WORKSPACE/target/${{ matrix.target }}/debug/porthub-terminal${{ matrix.extension }}" --input sync "$PORTHUB_TEST_SYNC_EXECUTABLE"
          echo "PORTHUB_COMPONENT_CACHE=$component_cache" >> "$GITHUB_ENV"
          echo "PORTHUB_COMPONENT_SHARED_CACHE=off" >> "$GITHUB_ENV"
          echo "PORTHUB_COMPONENT_SOURCE=github" >> "$GITHUB_ENV"
      - name: Compile focused Windows watch checks
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --locked -p porthub-transfer --no-run --target ${{ matrix.target }}
          cargo test --locked -p porthub-agent --test upload --no-run --target ${{ matrix.target }}
      - name: Verify native Windows CLI startup
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/run-with-timeout.py 10 "target/${{ matrix.target }}/debug/porthub.exe" --version
      - name: Verify protected Windows enrollment and PATH registration
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --lib windows_path_tests --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --test windows_bootstrap --target ${{ matrix.target }} -- --include-ignored
      - name: Verify Windows watch jobs with a bounded runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-transfer --target ${{ matrix.target }} -- --nocapture
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --test upload --target ${{ matrix.target }} -- --nocapture
      - name: Compile complete platform checks
        shell: bash
        run: cargo test --locked -p porthub-agent -p porthub-transfer -p porthub-tunnel -p porthub-identity -p porthub-mesh -p porthub-network -p porthub-io --target ${{ matrix.target }} --no-run
      - name: Test transfers, management and tunnel adapters
        shell: bash
        run: python scripts/run-with-timeout.py 240 cargo test --locked -p porthub-agent -p porthub-transfer -p porthub-tunnel -p porthub-identity -p porthub-mesh -p porthub-network -p porthub-io --target ${{ matrix.target }}
      - name: Gate Linux private-network prerequisite preparation and unified activation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --lib private_prerequisites --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --lib private_dns_setup --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --lib private_resolver_file --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --test service private_dependency_failure --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-network --lib expired_policy_fails_closed_with_an_actionable_clock_diagnostic --target ${{ matrix.target }}
      - name: Verify real privileged enrollment preparation on the disposable Linux runner
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          cargo test --locked -p porthub-agent --lib --no-run --message-format=json --target ${{ matrix.target }} > /tmp/porthub-native-preparation-tests.jsonl
          test_executable="$(python3 -c 'import json; rows=[json.loads(line) for line in open("/tmp/porthub-native-preparation-tests.jsonl")]; print(next(row["executable"] for row in reversed(rows) if row.get("reason")=="compiler-artifact" and row.get("executable") and row["target"]["name"]=="porthub_agent"))')"
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted "$test_executable" --ignored --exact private_prerequisites::native_ci_tests::privileged_enrollment_preparation_is_idempotent_and_preserves_system_dns
      - name: Test packaged terminal runtime and ordinary SSH participation
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --locked -p porthub-terminal --features ssh --target ${{ matrix.target }} -- --include-ignored
      - name: Test experimental native terminal transports and recovery
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-terminal --features direct,viewer-history --lib direct::viewer --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-terminal --features direct,viewer-history --test native_direct --target ${{ matrix.target }} -- --include-ignored
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --features terminal-direct --lib terminal_ --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --no-default-features --lib terminal_policy --target ${{ matrix.target }}
          python scripts/run-with-timeout.py 90 cargo test --locked -p porthub-agent --features terminal-direct --bin porthub cli_tests::native_terminal_join_is_opt_in_and_does_not_require_system_privileges --target ${{ matrix.target }}
      - name: Verify local terminals and native participant controls
        if: inputs.verify_only == true && runner.os != 'Windows'
        shell: bash
        env:
          PORTHUB_TEST_AGENT_EXECUTABLE: ${{ github.workspace }}/target/${{ matrix.target }}/debug/porthub
        run: |
          cargo test --locked -p porthub-agent --test terminal_local --test terminal_share --target ${{ matrix.target }} -- --include-ignored
          python3 scripts/test-stats-terminal.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
          PORTHUB_COMPONENT_TRANSPORT=cli python3 scripts/test-stats-terminal.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
          python3 scripts/test-terminal-participants.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
          python3 scripts/test-terminal-workspace-helper.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
      - name: Verify dashboard CLI fallback under process-local bind denial
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/test-stats-cli-fallback.py "$GITHUB_WORKSPACE/target/${{ matrix.target }}/debug/porthub"
      - name: Build independently packaged native core and optional tools
        if: inputs.verify_only != true && runner.os != 'Linux'
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          previous=()
          if [ -n "${PORTHUB_PREVIOUS_COMPONENT_BUILDS:-}" ]; then previous=(--previous "$PORTHUB_PREVIOUS_COMPONENT_BUILDS"); fi
          python scripts/build-component-platform.py --target '${{ matrix.target }}' --source-revision "$PORTHUB_SOURCE_REVISION" --output component-builds "${previous[@]}"
      - name: Restore shipping Linux terminal runtime
        id: shipping_terminal_cache
        if: inputs.verify_only != true && runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: .cache/terminal-helper
          key: terminal-shipping-v1-${{ matrix.target }}-${{ hashFiles('vendor/terminal/sources.json', 'scripts/build-terminal-helper.py') }}
      - name: Build indexed static Linux core and optional tools
        if: inputs.verify_only != true && runner.os == 'Linux'
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          shipping_target="$(echo '${{ matrix.target }}' | sed 's/-gnu$/-musl/')"
          terminal_bundle="$(python3 scripts/build-terminal-helper.py --target "$shipping_target")"
          export PORTHUB_TERMINAL_BUNDLE="$terminal_bundle"
          echo "PORTHUB_TEST_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo "PORTHUB_TEST_TERMINAL_TARGET=$shipping_target" >> "$GITHUB_ENV"
          target_key="$(echo "$shipping_target" | tr '[:lower:]-' '[:upper:]_')"
          compiler_key="$(echo "$shipping_target" | tr '-' '_')"
          export "CARGO_TARGET_${target_key}_LINKER=musl-gcc"
          export "CC_${compiler_key}=musl-gcc"
          previous=()
          if [ -n "${PORTHUB_PREVIOUS_COMPONENT_BUILDS:-}" ]; then previous=(--previous "$PORTHUB_PREVIOUS_COMPONENT_BUILDS"); fi
          python3 scripts/build-component-platform.py --target "$shipping_target" --source-revision "$PORTHUB_SOURCE_REVISION" --output component-builds "${previous[@]}"
          python3 scripts/verify-static-components.py --builds component-builds
      - name: Save shipping Linux terminal runtime
        if: inputs.verify_only != true && runner.os == 'Linux' && steps.shipping_terminal_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/terminal-helper
          key: ${{ steps.shipping_terminal_cache.outputs.cache-primary-key }}
      - name: Prepare checks against exact packaged native components
        if: inputs.verify_only != true
        shell: bash
        run: python scripts/prepare-packaged-component-checks.py --builds component-builds --core-output 'dist/porthub-${{ matrix.artifact }}${{ matrix.extension }}' --cache "$RUNNER_TEMP/porthub-packaged-components-${{ matrix.target }}"
      - name: Verify packaged native core startup
        if: inputs.verify_only != true
        shell: bash
        run: python scripts/run-with-timeout.py 10 'dist/porthub-${{ matrix.artifact }}${{ matrix.extension }}' --version
      - name: Test packaged HTTP server lifecycle
        if: inputs.verify_only != true
        shell: bash
        env:
          PORTHUB_TEST_AGENT_EXECUTABLE: ${{ github.workspace }}/dist/porthub-${{ matrix.artifact }}${{ matrix.extension }}
        run: cargo test --locked -p porthub-agent --test http_management --target ${{ matrix.target }}
      - name: Test packaged local terminal workspaces
        if: inputs.verify_only != true && runner.os != 'Windows'
        shell: bash
        env:
          PORTHUB_TEST_AGENT_EXECUTABLE: ${{ github.workspace }}/dist/porthub-${{ matrix.artifact }}${{ matrix.extension }}
        run: |
          cargo test --locked -p porthub-agent --test terminal_local --test terminal_share --target ${{ matrix.target }} -- --include-ignored
          python3 scripts/test-stats-terminal.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
          PORTHUB_COMPONENT_TRANSPORT=cli python3 scripts/test-stats-terminal.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
          python3 scripts/test-terminal-participants.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
          python3 scripts/test-terminal-workspace-helper.py "$PORTHUB_TEST_AGENT_EXECUTABLE"
      - name: Test native macOS service lifecycle
        if: runner.os == 'macOS'
        shell: bash
        env:
          PORTHUB_TEST_LAUNCHD: "1"
        run: cargo test --locked -p porthub-agent --test launchd_live --target ${{ matrix.target }} -- --include-ignored
      - uses: actions/upload-artifact@v4
        if: inputs.verify_only != true
        with:
          name: porthub-${{ matrix.artifact }}
          path: component-builds/
          if-no-files-found: error
          retention-days: 3
  linux-32:
    needs: [select-platforms]
    if: needs.select-platforms.outputs.has_linux == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-platforms.outputs.linux) }}
    env:
      PORTHUB_SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      RUST_MIN_STACK: "33554432"
      PORTHUB_TERMINAL_HELPER_CACHE_ROOT: ${{ github.workspace }}/.cache/terminal-helper
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Restore verified prior component builds
        if: inputs.verify_only != true && inputs.previous_components == true
        uses: actions/download-artifact@v4
        with:
          name: component-reuse-${{ matrix.artifact }}
          path: ${{ runner.temp }}/porthub-component-reuse
      - name: Select verified prior component input directory
        if: inputs.verify_only != true && inputs.previous_components == true
        shell: bash
        run: echo "PORTHUB_PREVIOUS_COMPONENT_BUILDS=$RUNNER_TEMP/porthub-component-reuse" >> "$GITHUB_ENV"
      - name: Read numeric release version
        shell: bash
        run: echo "PORTHUB_VERSION=$(sh scripts/release-version.sh)" >> "$GITHUB_ENV"
      - name: Install build-only cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison ncurses-bin ${{ matrix.packages }}
      - run: rustup target add ${{ matrix.target }}
      - name: Restore independent cross-compiled terminal runtime
        id: terminal_helper_cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/terminal-helper
          key: terminal-v2-linux32-${{ matrix.target }}-${{ inputs.verify_only == true && 'gnu' || 'musl' }}-${{ hashFiles('vendor/terminal/sources.json', 'scripts/build-terminal-helper.py') }}
      - name: Build or reuse cross-compiled terminal runtime
        shell: bash
        run: |
          terminal_target='${{ matrix.target }}'
          if [ '${{ inputs.verify_only }}' != 'true' ]; then
            terminal_target="$(echo "$terminal_target" | sed 's/-gnu/-musl/')"
          fi
          terminal_bundle="$(python3 scripts/build-terminal-helper.py --target "$terminal_target" --cc '${{ matrix.compiler }}' --ar '${{ matrix.ar }}')"
          echo "PORTHUB_TERMINAL_BUNDLE=$terminal_bundle" >> "$GITHUB_ENV"
          echo "PORTHUB_SHIPPING_TARGET=$terminal_target" >> "$GITHUB_ENV"
      - name: Cache completed cross-compiled terminal runtime before Rust checks
        if: steps.terminal_helper_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/terminal-helper
          key: ${{ steps.terminal_helper_cache.outputs.cache-primary-key }}
      - name: Save cross-compiled terminal helper failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-helper-log-${{ matrix.artifact }}
          include-hidden-files: true
          path: |
            .cache/terminal-helper/**/build.log
            .cache/terminal-helper/**/config.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Cache compiled 32-bit Rust libraries
        uses: Swatinem/rust-cache@v2
        with:
          key: linux32-${{ matrix.target }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Verify cross-compiled runtime survives Rust cache restoration
        shell: bash
        run: test -s "$PORTHUB_TERMINAL_BUNDLE"
      - name: Check agent for 32-bit Linux
        if: inputs.verify_only == true
        shell: bash
        run: |
          target_key=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          export "CARGO_TARGET_${target_key}_LINKER=${{ matrix.compiler }}"
          cc_target_key=$(echo '${{ matrix.target }}' | tr '-' '_')
          export "CC_${cc_target_key}=${{ matrix.compiler }}"
          export "AR_${cc_target_key}=${{ matrix.ar }}"
          cargo check --locked -p porthub-agent --all-targets --target ${{ matrix.target }}
      - name: Build indexed static components for 32-bit Linux
        if: inputs.verify_only != true
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          rustup target add --toolchain 1.99.1 "$PORTHUB_SHIPPING_TARGET"
          shipping_cc="$(dirname "$PORTHUB_TERMINAL_BUNDLE")/musl-runtime/bin/musl-gcc"
          test -x "$shipping_cc"
          target_key="$(echo "$PORTHUB_SHIPPING_TARGET" | tr '[:lower:]-' '[:upper:]_')"
          compiler_key="$(echo "$PORTHUB_SHIPPING_TARGET" | tr '-' '_')"
          export "CARGO_TARGET_${target_key}_LINKER=$shipping_cc"
          export "CC_${compiler_key}=$shipping_cc"
          export "AR_${compiler_key}=${{ matrix.ar }}"
          previous=()
          if [ -n "${PORTHUB_PREVIOUS_COMPONENT_BUILDS:-}" ]; then previous=(--previous "$PORTHUB_PREVIOUS_COMPONENT_BUILDS"); fi
          python3 scripts/build-component-platform.py --target "$PORTHUB_SHIPPING_TARGET" --source-revision "$PORTHUB_SOURCE_REVISION" --output component-builds "${previous[@]}"
          python3 scripts/verify-static-components.py --builds component-builds
      - name: Enable ARM user-mode execution on the isolated CI runner
        if: inputs.verify_only != true && matrix.artifact != 'x86'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Prepare checks against packaged cross-compiled components
        if: inputs.verify_only != true
        run: python3 scripts/prepare-packaged-component-checks.py --builds component-builds --core-output 'dist/porthub-${{ matrix.artifact }}' --cache "$RUNNER_TEMP/porthub-packaged-components-${{ matrix.target }}"
      - name: Exercise packaged 32-bit CLI and optional terminal runtime
        if: inputs.verify_only != true
        run: python3 scripts/test-packaged-terminal-smoke.py "dist/porthub-${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        if: inputs.verify_only != true
        with:
          name: porthub-${{ matrix.artifact }}
          path: component-builds/
          if-no-files-found: error
          retention-days: 3
