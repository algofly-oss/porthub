[package]
name = "porthub-network"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
default = []
private-stream = ["dep:smoltcp"]
netns-tests = []

[dependencies]
anyhow.workspace = true
tokio.workspace = true
porthub-mesh = { path = "../porthub-mesh" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1.12"
getrandom = "0.3"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["rt"] }
smoltcp = { version = "=0.14.0", optional = true, default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
