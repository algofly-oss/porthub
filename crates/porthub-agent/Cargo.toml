[package]
name = "porthub-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "porthub"
path = "src/main.rs"

[features]
default = ["private-stream", "local-tor"]
local-tor = ["private-stream", "dep:porthub-egress"]
netns-tests = []
private-stream = ["dep:smoltcp", "porthub-mesh/streams"]
root-dns-test = []
handoff-service-test = []

[dependencies]
getifaddrs = "0.6.2"
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
porthub-tunnel.workspace = true
porthub-transfer = { path = "../porthub-transfer" }
porthub-egress = { path = "../porthub-egress", optional = true }
porthub-mesh = { path = "../porthub-mesh" }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.12"
getrandom = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config"] }
tokio-util = { version = "0.7", features = ["rt"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
fs2 = "0.4"
hostname = "0.4"
directories = "6"
sha2 = "0.10"
async-trait = "0.1"
futures-util.workspace = true
tracing.workspace = true
notify = "8.2"
libc = "0.2"
smoltcp = { version = "=0.14.0", optional = true, default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
axum.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
porthub-identity = { path = "../porthub-identity" }
porthub-edge = { path = "../porthub-edge" }
porthub-runtime = { path = "../porthub-runtime" }

[target.'cfg(target_os = "linux")'.dependencies]
nlink = "0.33"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"
core-foundation = "0.9"
tun-rs = { version = "=2.8.13", default-features = false, features = ["async"] }
route_manager = { version = "=0.2.9", features = ["async"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }
tun-rs = { version = "=2.8.13", default-features = false, features = ["async"] }
route_manager = { version = "=0.2.9", features = ["async"] }
