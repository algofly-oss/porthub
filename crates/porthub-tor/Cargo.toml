[package]
name = "porthub-tor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
clap.workspace = true
directories = "6"
porthub-components = { path = "../porthub-components" }
porthub-egress = { path = "../porthub-egress", default-features = false, features = ["tor"] }
serde_json = "1"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
