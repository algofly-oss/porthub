[package]
name = "porthub-egress"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["tor", "websocket"]
tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:rustls"]
websocket = ["dep:tokio-tungstenite"]

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
arti-client = { version = "=0.47.0", optional = true, default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite"] }
tor-rtcompat = { version = "=0.47.0", optional = true, default-features = false, features = ["tokio", "rustls"] }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["compat", "rt"] }
serde = { version = "1", features = ["derive"] }
subtle = "2"
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
base64 = "0.22"
futures-util = { workspace = true, features = ["io"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
serde_json = "1"
