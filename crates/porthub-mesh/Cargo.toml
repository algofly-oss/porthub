[package]
name = "porthub-mesh"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
streams = ["dep:quinn", "dep:rustls"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sansio = "1"
rtc-crypto = { version = "=0.21.1", default-features = false, features = ["crypto-ring"] }
rtc-dtls = "=0.21.1"
rtc-ice = "=0.21.1"
rtc-shared = { version = "=0.21.1", default-features = false }

async-trait = "0.1"
futures-util.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
turn = "=0.17.2"
stun = "=0.17.2"
turn-util = { package = "webrtc-util", version = "=0.17.2", default-features = false, features = ["conn"] }
url = "2"
socket2 = { version = "0.6", features = ["all"] }
quinn = { version = "=0.11.12", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring"] }

[dev-dependencies]
serde_json = "1"
