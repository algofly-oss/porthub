[package]
name = "porthub-terminal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
ssh = ["dep:russh", "dep:rand10"]

[dependencies]
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
russh = { version = "=0.65.0", default-features = false, features = ["ring"], optional = true }

rand10 = { package = "rand", version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.9"
flate2 = "1"
tar = { version = "0.4", default-features = false }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
