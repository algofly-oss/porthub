[package]
name = "porthub-terminal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
default = ["hosting"]
hosting = ["dep:portable-pty", "dep:flate2", "dep:tar", "dep:tempfile"]
direct = ["hosting", "dep:rtc", "dep:bytes", "dep:porthub-mesh", "dep:socket2"]
viewer-history = ["dep:unicode-width", "dep:unicode-segmentation"]
ssh = ["dep:russh", "dep:rand10", "viewer-history"]

[dependencies]
socket2 = { version = "0.6", features = ["all"], optional = true }
porthub-mesh = { path = "../porthub-mesh", optional = true }
rtc = { version = "=0.21.1", default-features = false, features = ["crypto-ring"], optional = true }
bytes = { version = "1.12", optional = true }
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
russh = { version = "=0.65.0", default-features = false, features = ["ring"], optional = true }

unicode-width = { version = "0.2", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
rand10 = { package = "rand", version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = { version = "0.9", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
