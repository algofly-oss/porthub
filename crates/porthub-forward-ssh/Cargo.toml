[package]
name = "porthub-forward-ssh"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
hmac = "0.12"
rand = "0.8"
russh = { version = "=0.65.0", default-features = false, features = ["ring"] }
sha2 = "0.10"
tempfile = "3"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
