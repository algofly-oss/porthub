[package]
name = "porthub-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = { version = "0.9", default-features = false, features = ["client"] }
tokio.workspace = true
fs2 = "0.4"
libc = "0.2"
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.5"
rustix = { version = "1", features = ["process"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
base64 = "0.22"
percent-encoding = "2"
notify = "5.2"
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
bcrypt = "0.17"
subtle = "2"

[dev-dependencies]
tempfile = "3"
futures-util.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
