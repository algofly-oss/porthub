[package]
name = "porthub-media-helper"
version = "0.2.1"
edition.workspace = true
publish.workspace = true

[package.metadata.porthub_media]
minimum_core = "1.11.34"

[dependencies]
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
porthub-components = { path = "../porthub-components" }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "=0.10.1", features = ["v0_3_65"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Threading", "Win32_Security", "Win32_System_RemoteDesktop", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_Media_MediaFoundation", "Win32_Graphics_Imaging"] }

windows-core = "=0.62.2"
