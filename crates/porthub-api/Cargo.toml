[package]
name = "porthub-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
unicode-normalization = "0.1"
turn = "=0.17.2"
turn-util = { package = "webrtc-util", version = "0.17.1", default-features = false, features = ["conn"] }
async-trait = "0.1"
subtle = "2"
porthub-identity = { path = "../porthub-identity" }
anyhow.workspace = true
porthub-runtime = { path = "../porthub-runtime" }
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mongodb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
chrono = "0.4"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4"] }
futures-util.workspace = true
base64 = "0.22"
regex = "1"
sha2 = "0.10"
hmac = "0.13"
sha1 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
percent-encoding = "2"
tempfile = "3"
toml = "0.5"
url = "2"
socketioxide = { version = "0.18.7", features = ["extensions"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
httpdate = "1"
libc = "0.2"
porthub-mesh = { path = "../porthub-mesh" }
porthub-egress = { path = "../porthub-egress", default-features = false }


[dev-dependencies]
tokio-tungstenite = "0.30"
porthub-tunnel = { workspace = true, features = ["http-access"] }
porthub-edge = { path = "../porthub-edge" }
porthub-agent = { path = "../porthub-agent" }
