[package]
name = "porthub-terminal-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
[[bin]]
name = "porthub-terminal"
path = "src/main.rs"
[dependencies]
anyhow.workspace = true
async-trait = "0.1"
clap.workspace = true
directories = "6"
fs2 = "0.4"
sha2 = "0.10"
serde_json = "1"
tempfile = "3"
libc = "0.2"
porthub-components = { path = "../porthub-components" }
porthub-terminal = { path = "../porthub-terminal" }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
[build-dependencies]
flate2 = "1"
tar = "0.4"
serde_json = "1"
[dev-dependencies]
flate2 = "1"
tar = "0.4"
tempfile = "3"
serde_json = "1"
