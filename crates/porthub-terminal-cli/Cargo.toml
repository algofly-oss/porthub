[package]
name = "porthub-terminal-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
[[bin]]
name = "porthub-terminal"
path = "src/main.rs"
[dependencies]
anyhow.workspace = true
async-trait = "0.1"
clap.workspace = true
directories = "6"
porthub-components = { path = "../porthub-components" }
porthub-terminal = { path = "../porthub-terminal" }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
[dev-dependencies]
tempfile = "3"
serde_json = "1"
