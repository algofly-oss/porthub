[package]
name = "porthub-identity"
# Internal library version: CLI/server release bumps must not invalidate this cache.
version = "1.8.4"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
sha2 = "0.10"
hex = "0.4"
subtle = "2"
x509-parser = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rcgen = "0.14"
