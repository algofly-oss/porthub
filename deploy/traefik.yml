# PortHub's own web app and API on ports 8345 (HTTP) and 8346 (HTTPS).
# Replaces the former nginx "proxy" container; clients keep using the same
# URLs. Copied into the dynamic config directory at container start.
http:
  routers:
    porthub_internal_relay:
      entryPoints: ["porthub"]
      rule: "PathPrefix(`/api/access/private/relay`)"
      priority: 200
      service: porthub_internal_relay
    porthub_internal_relay_tls:
      entryPoints: ["porthubsecure"]
      rule: "PathPrefix(`/api/access/private/relay`)"
      priority: 200
      service: porthub_internal_relay
      tls: {}
    porthub_internal_api:
      entryPoints: ["porthub"]
      rule: "PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/install/`)"
      priority: 100
      service: porthub_internal_api
    porthub_internal_ui:
      entryPoints: ["porthub"]
      rule: "PathPrefix(`/`)"
      priority: 1
      service: porthub_internal_ui
    porthub_internal_api_tls:
      entryPoints: ["porthubsecure"]
      rule: "PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/install/`)"
      priority: 100
      service: porthub_internal_api
      tls: {}
    porthub_internal_ui_tls:
      entryPoints: ["porthubsecure"]
      rule: "PathPrefix(`/`)"
      priority: 1
      service: porthub_internal_ui
      tls: {}
  services:
    porthub_internal_relay:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:47091"
    porthub_internal_api:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:47080"
    porthub_internal_ui:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:47030"
tls:
  certificates:
    - certFile: /app/deploy/certificates/server.crt
      keyFile: /app/deploy/certificates/server.key
